<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0052CC;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#2684FF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00C7E6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6554C0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0052CC;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#0052CC" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="128" fill="#0A0E17"/>
  <rect x="24" y="24" width="464" height="464" rx="104" fill="url(#glow)" opacity="0.15" stroke="rgba(255,255,255,0.1)" stroke-width="2"/>
  
  <!-- Jira / Clock stylized icon -->
  <circle cx="256" cy="256" r="140" fill="none" stroke="url(#grad1)" stroke-width="24" filter="url(#shadow)" stroke-dasharray="880" stroke-dashoffset="180" stroke-linecap="round"/>
  
  <!-- Clock hands / Checkmark -->
  <line x1="256" y1="256" x2="256" y2="160" stroke="#FFFFFF" stroke-width="20" stroke-linecap="round"/>
  <line x1="256" y1="256" x2="330" y2="256" stroke="#00C7E6" stroke-width="18" stroke-linecap="round"/>
  
  <circle cx="256" cy="256" r="18" fill="#FFFFFF"/>
  <circle cx="256" cy="256" r="8" fill="#0052CC"/>
  
  <!-- Mini badge -->
  <rect x="180" y="370" width="152" height="48" rx="24" fill="url(#grad1)"/>
  <text x="256" y="401" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="bold" fill="#FFFFFF" text-anchor="middle">LOG 8h</text>
</svg>
